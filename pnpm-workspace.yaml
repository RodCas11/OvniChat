packages:
  - apps/*
  - services/*
  - packages/*

allowBuilds:
  electron: true
  esbuild: true
  # T13.4 (ADR 0021): uiohook-napi's own "install" script is literally `node-gyp-build`, the same
  # lookup its own `require()`-time code path (`dist/index.js`) already performs to find a matching
  # prebuilt binary under its own `prebuilds/` directory (verified directly against the real published
  # 1.5.5 tarball, including its bundled `prebuilds/win32-x64/uiohook-napi.node`) — this script never
  # invokes a real `node-gyp rebuild`/compiler toolchain unless no matching prebuild exists for the
  # current platform/arch, which is exactly the ADR's own "no compile step at install time on the
  # operator's machine" selling point for choosing this dependency in the first place. Allowed to run.
  uiohook-napi: true

auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv

# Forge 7 -> @electron/rebuild pins Electron's node-gyp fork by an exact Git commit. The
# dependency guard verifies this is the only approved exotic subdependency in the lockfile.
blockExoticSubdeps: false
engineStrict: true
nodeLinker: hoisted
overrides:
  # @electron/packager stays at its natural Forge 7.11.2 resolution (18.x). Packager >=19
  # promisified all its lifecycle hooks; Forge 7.11.2's packaging pipeline still calls hooks
  # with the old (args..., done) callback convention, so packager >=19 makes every
  # `electron-forge package` run crash. See docs/references/VERSION_DECISIONS.md.
  tar: 7.5.22
  tmp: 0.2.7
patchedDependencies:
  # extract-zip 2.0.1 (a transitive dependency of @electron/packager 18.x) has an unvalidated
  # symlink-target write (CVE-2026-56876 / GHSA-jmr9-qjv8-65gv) with no upstream fix released.
  # This patch adds the missing target-containment check. See VERSION_DECISIONS.md.
  extract-zip@2.0.1: patches/extract-zip@2.0.1.patch
saveExact: true
strictPeerDependencies: true
